project_id = "spin-hobby"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173", "http://localhost:5173/**",
  "https://spinhobby.com", "https://spinhobby.com/**",
  "https://www.spinhobby.com/**", "https://admin.spinhobby.com/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Passwordless sign-in links/codes for staff and shoppers.
enable_confirmations = false

# Google sign-in. Create an OAuth client in Google Cloud Console and set these
# as secrets (or paste them in Supabase Dashboard > Authentication > Providers > Google).
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.discord]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET)"

[storage]
enabled = true

[functions.store-api]
verify_jwt = false

[functions.square-sync]
verify_jwt = false
